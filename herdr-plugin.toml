id = "herdr-panel"
name = "Herdr Panel"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Your herdr agents and their status in your desktop panel (KDE Plasma 6 for now)"
platforms = ["linux"]

# `herdr plugin install lukeda/herdr-panel` runs this. install.sh detects which
# desktop panels are available and installs the matching widget.
[[build]]
command = ["sh", "install.sh"]

# For locally linked checkouts (build only runs on GitHub installs) and for
# reinstalling after a manual uninstall.
[[actions]]
id = "install"
title = "Install/update panel widgets"
contexts = ["global"]
command = ["sh", "install.sh"]

[[actions]]
id = "uninstall"
title = "Uninstall panel widgets"
contexts = ["global"]
command = ["sh", "install.sh", "--uninstall"]
