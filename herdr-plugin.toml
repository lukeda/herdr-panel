id = "herdr-kde"
name = "KDE Plasma Agents Widget"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "KDE Plasma 6 panel widget that shows your herdr agents and their status"
platforms = ["linux"]

# `herdr plugin install lukeda/herdr-kde` runs this, which installs (or
# upgrades) the Plasma widget. Add it to a panel via "Add Widgets…".
[[build]]
command = ["sh", "install.sh"]

# For locally linked checkouts (build only runs on GitHub installs) and for
# reinstalling after a manual uninstall.
[[actions]]
id = "install-widget"
title = "Install/update KDE widget"
contexts = ["global"]
command = ["sh", "install.sh"]

[[actions]]
id = "uninstall-widget"
title = "Uninstall KDE widget"
contexts = ["global"]
command = ["sh", "install.sh", "--uninstall"]
