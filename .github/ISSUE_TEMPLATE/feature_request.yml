name: Feature request
description: Suggest an improvement or support for another desktop/bar
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case, not just the solution.
      placeholder: When an agent gets blocked I don't notice until ...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could herdr-panel help? Mockups or sketches welcome.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - KDE Plasma widget
        - Support for another desktop or bar (Waybar, GNOME, ...)
        - Install / herdr plugin
        - Other
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself (see CONTRIBUTING.md)
